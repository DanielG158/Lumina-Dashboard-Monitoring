name: CI
on:
  push:
    branches: [main]
  pull_request:
# A newer push replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:fast
      - name: Browser tests
        run: |
          npx playwright-core install --with-deps chromium
          node tests/run.mjs
